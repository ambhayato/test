<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Outlook カレンダー</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">

  <!-- ── Header ──────────────────────────────────────────────────────────────── -->
  <header id="header">
    <i class="bi bi-calendar3 fs-5"></i>
    <span class="app-title">Outlook カレンダー</span>
    <div class="header-actions">
      <span id="connection-status" class="badge bg-danger">未接続</span>
      <button class="btn-icon" id="btn-refresh" title="更新"><i class="bi bi-arrow-clockwise fs-5"></i></button>
      <button class="btn-icon" id="btn-settings" title="設定"><i class="bi bi-gear fs-5"></i></button>
    </div>
  </header>

  <div id="main">

    <!-- ── Sidebar ──────────────────────────────────────────────────────────── -->
    <aside id="sidebar">
      <!-- Mini calendar -->
      <div class="sidebar-section">
        <div id="mini-calendar"></div>
      </div>

      <!-- My calendar -->
      <div class="sidebar-section">
        <h6>自分の予定表</h6>
        <div id="my-calendar-item" class="user-item" data-email="">
          <span class="user-color-dot" style="background:#0078d4"></span>
          <span class="user-name" id="my-calendar-label">カレンダー</span>
          <input type="checkbox" class="form-check-input user-toggle" checked>
        </div>
      </div>

      <!-- Other users -->
      <div class="sidebar-section">
        <h6>他のユーザーの予定表</h6>
        <div id="other-users-list"></div>
        <button class="btn btn-outline-primary btn-add-user btn-sm" id="btn-add-user">
          <i class="bi bi-plus"></i> ユーザーを追加
        </button>
      </div>
    </aside>

    <!-- ── Calendar area ──────────────────────────────────────────────────────── -->
    <div id="calendar-wrapper">
      <div id="calendar-toolbar">
        <button class="btn btn-primary btn-sm" id="btn-new-event">
          <i class="bi bi-plus-lg"></i> 新しい予定
        </button>
        <div class="btn-group btn-group-sm ms-2" id="view-switcher">
          <button class="btn btn-outline-secondary" data-view="dayGridMonth">月</button>
          <button class="btn btn-outline-secondary active" data-view="timeGridWeek">週</button>
          <button class="btn btn-outline-secondary" data-view="timeGridDay">日</button>
          <button class="btn btn-outline-secondary" data-view="listWeek">リスト</button>
        </div>
        <div class="ms-auto position-relative">
          <div class="input-group input-group-sm">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="text" id="search-input" class="form-control" placeholder="予定を検索..." autocomplete="off">
            <button class="btn btn-outline-secondary" id="btn-clear-search" type="button" title="クリア">×</button>
          </div>
          <div id="search-results"></div>
        </div>
      </div>
      <div id="calendar-container">
        <div id="calendar"></div>
      </div>
    </div>

  </div><!-- #main -->

</div><!-- #app -->

<!-- ── Event detail panel ─────────────────────────────────────────────────────── -->
<div id="event-detail-panel">
  <div class="d-flex justify-content-between align-items-start mb-3">
    <h5 id="detail-title" class="mb-0" style="flex:1;word-break:break-all"></h5>
    <div class="d-flex gap-1 ms-2">
      <button class="btn btn-sm btn-outline-primary" id="btn-detail-edit"><i class="bi bi-pencil"></i></button>
      <button class="btn btn-sm btn-outline-danger" id="btn-detail-delete"><i class="bi bi-trash"></i></button>
      <button class="btn btn-sm btn-outline-secondary" id="btn-detail-close"><i class="bi bi-x-lg"></i></button>
    </div>
  </div>
  <div class="detail-field">
    <div class="detail-label"><i class="bi bi-clock me-1"></i>日時</div>
    <div class="detail-value" id="detail-datetime"></div>
  </div>
  <div class="detail-field" id="detail-location-row" style="display:none">
    <div class="detail-label"><i class="bi bi-geo-alt me-1"></i>場所</div>
    <div class="detail-value" id="detail-location"></div>
  </div>
  <div class="detail-field" id="detail-organizer-row" style="display:none">
    <div class="detail-label"><i class="bi bi-person me-1"></i>開催者</div>
    <div class="detail-value" id="detail-organizer"></div>
  </div>
  <div class="detail-field" id="detail-body-row" style="display:none">
    <div class="detail-label"><i class="bi bi-card-text me-1"></i>メモ</div>
    <div class="detail-value" id="detail-body" style="white-space:pre-wrap;font-size:12px;color:#605e5c"></div>
  </div>
</div>

<!-- ── Settings modal ────────────────────────────────────────────────────────── -->
<div class="modal fade" id="settingsModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-gear me-2"></i>EWS 接続設定</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">Exchange サーバー URL <span class="text-danger">*</span></label>
          <input type="url" class="form-control" id="cfg-host" placeholder="https://mail.yourdomain.com">
          <div class="form-text">例: https://outlook.office365.com (Microsoft 365の場合)</div>
        </div>
        <div class="mb-3">
          <label class="form-label">ユーザー名 (メールアドレス) <span class="text-danger">*</span></label>
          <input type="text" class="form-control" id="cfg-username" placeholder="user@yourdomain.com">
        </div>
        <div class="mb-3">
          <label class="form-label">パスワード <span class="text-danger">*</span></label>
          <input type="password" class="form-control" id="cfg-password">
        </div>
        <div class="mb-3">
          <label class="form-label">認証方式</label>
          <select class="form-select" id="cfg-auth">
            <option value="ntlm">NTLM (社内Exchange 推奨)</option>
            <option value="basic">Basic認証</option>
          </select>
        </div>
        <div id="cfg-error" class="alert alert-danger d-none"></div>
        <div id="cfg-success" class="alert alert-success d-none"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" id="btn-test-connection">
          <i class="bi bi-plug me-1"></i>接続テスト
        </button>
        <button type="button" class="btn btn-primary" id="btn-save-config">
          <i class="bi bi-check-lg me-1"></i>保存して接続
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ── Event editor modal ──────────────────────────────────────────────────── -->
<div class="modal fade" id="eventModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="eventModalTitle">新しい予定</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="ev-id">
        <input type="hidden" id="ev-change-key">
        <div class="mb-3">
          <label class="form-label">タイトル <span class="text-danger">*</span></label>
          <input type="text" class="form-control" id="ev-title" placeholder="予定のタイトル">
        </div>
        <div class="row mb-3">
          <div class="col">
            <label class="form-label">開始日時 <span class="text-danger">*</span></label>
            <input type="datetime-local" class="form-control" id="ev-start">
          </div>
          <div class="col">
            <label class="form-label">終了日時 <span class="text-danger">*</span></label>
            <input type="datetime-local" class="form-control" id="ev-end">
          </div>
        </div>
        <div class="form-check mb-3">
          <input type="checkbox" class="form-check-input" id="ev-allday">
          <label class="form-check-label" for="ev-allday">終日</label>
        </div>
        <div class="mb-3">
          <label class="form-label">場所</label>
          <input type="text" class="form-control" id="ev-location" placeholder="会議室・場所">
        </div>
        <div class="mb-3">
          <label class="form-label">参加者 (メールアドレス、カンマ区切り)</label>
          <input type="text" class="form-control" id="ev-attendees" placeholder="user1@example.com, user2@example.com">
        </div>
        <div class="mb-3">
          <label class="form-label">メモ</label>
          <textarea class="form-control" id="ev-body" rows="3" placeholder="内容・メモ"></textarea>
        </div>
        <div id="ev-error" class="alert alert-danger d-none"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">キャンセル</button>
        <button type="button" class="btn btn-primary" id="btn-save-event">
          <i class="bi bi-check-lg me-1"></i>保存
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ── Add user modal ─────────────────────────────────────────────────────── -->
<div class="modal fade" id="addUserModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">ユーザーを追加</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">表示名</label>
          <input type="text" class="form-control" id="add-user-name" placeholder="山田 太郎">
        </div>
        <div class="mb-3">
          <label class="form-label">メールアドレス <span class="text-danger">*</span></label>
          <input type="email" class="form-control" id="add-user-email" placeholder="user@example.com">
        </div>
        <div id="add-user-error" class="alert alert-danger d-none"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">キャンセル</button>
        <button type="button" class="btn btn-primary" id="btn-confirm-add-user">追加</button>
      </div>
    </div>
  </div>
</div>

<!-- ── Toast container ────────────────────────────────────────────────────── -->
<div class="toast-container">
  <div id="toast" class="toast align-items-center border-0" role="alert">
    <div class="d-flex">
      <div class="toast-body" id="toast-msg"></div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/locales/ja.global.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
