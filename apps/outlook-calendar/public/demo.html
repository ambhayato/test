<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Outlook カレンダー — デモ</title>
  <link rel="stylesheet" href="vendor/bootstrap.min.css">
  <link rel="stylesheet" href="vendor/bootstrap-icons.min.css">
  <style>
    :root {
      --primary: #0078d4;
      --primary-dark: #005a9e;
      --sidebar-width: 280px;
      --header-height: 60px;
      --bg: #f3f2f1;
      --surface: #ffffff;
      --border: #e1dfdd;
      --text: #323130;
      --text-muted: #605e5c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
    #app { display: flex; flex-direction: column; height: 100vh; }
    #header {
      height: var(--header-height); background: var(--primary); color: #fff;
      display: flex; align-items: center; padding: 0 16px; gap: 12px; flex-shrink: 0;
      box-shadow: 0 2px 4px rgba(0,0,0,.2);
    }
    #header .app-title { font-size: 18px; font-weight: 600; flex: 1; }
    #header .header-actions { display: flex; gap: 8px; align-items: center; }
    #main { display: flex; flex: 1; overflow: hidden; }
    #sidebar {
      width: var(--sidebar-width); background: var(--surface);
      border-right: 1px solid var(--border); display: flex; flex-direction: column;
      overflow-y: auto; flex-shrink: 0;
    }
    .sidebar-section { padding: 12px 16px; border-bottom: 1px solid var(--border); }
    .sidebar-section h6 { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }
    .mini-cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .mini-cal-title { font-size: 13px; font-weight: 600; }
    .mini-cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 2px; }
    .mini-cal-day-label { font-size: 10px; text-align: center; color: var(--text-muted); font-weight: 600; padding: 2px; }
    .mini-cal-day {
      font-size: 11px; text-align: center; padding: 3px;
      cursor: pointer; border-radius: 50%; width: 24px; height: 24px;
      display: flex; align-items: center; justify-content: center; margin: auto;
    }
    .mini-cal-day:hover { background: #f0f0f0; }
    .mini-cal-day.today { background: var(--primary); color: #fff; font-weight: 700; }
    .mini-cal-day.other-month { color: #c8c6c4; }
    .user-item { display: flex; align-items: center; gap: 8px; padding: 6px 4px; border-radius: 4px; font-size: 13px; }
    .user-color-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .user-item .user-name { flex: 1; }
    .btn-add-user { width: 100%; margin-top: 8px; font-size: 12px; }
    #calendar-wrapper { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    #calendar-toolbar {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 8px 16px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    #search-input { max-width: 220px; font-size: 13px; }
    #calendar-container { flex: 1; overflow: auto; padding: 16px; }
    .fc { font-size: 13px; }
    .fc .fc-toolbar-title { font-size: 18px; font-weight: 600; }
    .fc .fc-button { font-size: 12px !important; padding: 4px 12px !important; }
    .fc .fc-button-primary { background-color: var(--primary) !important; border-color: var(--primary) !important; }
    .fc .fc-button-primary:hover { background-color: var(--primary-dark) !important; }
    .fc-event { cursor: pointer; font-size: 12px; border: none !important; border-radius: 3px !important; }
    #event-detail-panel {
      position: fixed; right: 0; top: var(--header-height); width: 340px;
      height: calc(100vh - var(--header-height)); background: var(--surface);
      border-left: 1px solid var(--border); box-shadow: -2px 0 8px rgba(0,0,0,.08);
      transform: translateX(100%); transition: transform .2s ease; z-index: 900;
      overflow-y: auto; padding: 20px;
    }
    #event-detail-panel.open { transform: translateX(0); }
    .detail-label { font-size: 11px; text-transform: uppercase; color: var(--text-muted); font-weight: 600; margin-bottom: 4px; }
    .detail-value { font-size: 14px; margin-bottom: 16px; }
    .detail-badge { display: inline-block; background: #f0f6ff; color: var(--primary); font-size: 11px; border-radius: 4px; padding: 2px 8px; margin-bottom: 16px; }
    .modal-header { background: var(--primary); color: #fff; }
    .modal-header .btn-close { filter: invert(1); }
    .form-label { font-size: 13px; font-weight: 600; }
    .btn-icon { background: none; border: none; cursor: pointer; padding: 6px; border-radius: 4px; color: inherit; }
    .btn-icon:hover { background: rgba(255,255,255,.15); }
    .toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; }
    .demo-badge { background: #fff3; font-size: 11px; padding: 2px 8px; border-radius: 10px; border: 1px solid rgba(255,255,255,.4); }
    /* legend */
    .legend { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .legend-item { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text-muted); }
    .legend-dot { width: 8px; height: 8px; border-radius: 50%; }
  </style>
</head>
<body>
<div id="app">
  <!-- Header -->
  <header id="header">
    <i class="bi bi-calendar3 fs-5"></i>
    <span class="app-title">Outlook カレンダー</span>

    <!-- Calendar area -->
    <div id="calendar-wrapper">

</div>

<!-- Event detail panel -->

<script>
// ── Demo data ─────────────────────────────────────────────────────────────────
const today = new Date();
const y = today.getFullYear(), m = today.getMonth(), d = today.getDate();

// Color palette: blue=自分, green=佐藤, red=鈴木
const C = { me: '#0078d4', sato: '#107c10', suzuki: '#c43d1c' };

const DEMO_EVENTS = [
  // ── 自分の予定 (青)
  { id:'1', title:'週次チームMTG', start: dt(d,9,0), end: dt(d,10,0), color: C.me,
    meta:{ loc:'第1会議室', owner:'自分 (yamada)', body:'週次の進捗確認ミーティング\n・先週のタスク確認\n・今週の予定共有', recurring:true } },
  { id:'2', title:'1on1 — 田中マネージャー', start: dt(d,14,0), end: dt(d,14,30), color: C.me,
    meta:{ loc:'Teams', owner:'自分 (yamada)', body:'キャリア相談・課題共有' } },
  { id:'3', title:'プロジェクトA レビュー', start: dt(d+1,13,0), end: dt(d+1,15,0), color: C.me,
    meta:{ loc:'第2会議室', owner:'自分 (yamada)', body:'Q2設計書レビュー\n参加者：開発チーム全員' } },
  { id:'4', title:'出張：大阪オフィス', start: dtAllDay(d+3), end: dtAllDay(d+5), allDay:true, color: C.me,
    meta:{ loc:'大阪オフィス', owner:'自分 (yamada)', body:'顧客訪問・要件定義' } },
  { id:'5', title:'四半期報告書 提出期限', start: dtAllDay(d+2), end: dtAllDay(d+3), allDay:true, color: C.me,
    meta:{ loc:'', owner:'自分 (yamada)', body:'' } },
  { id:'6', title:'ランチ会', start: dt(d+4,12,0), end: dt(d+4,13,0), color: C.me,
    meta:{ loc:'近くのイタリアン', owner:'自分 (yamada)', body:'' } },
  { id:'7', title:'システム保守作業', start: dt(d-1,22,0), end: dt(d,0,30), color: C.me,
    meta:{ loc:'サーバールーム', owner:'自分 (yamada)', body:'定期メンテナンス' } },

  // ── 佐藤さん (緑)
  { id:'s1', title:'クライアントMTG (佐藤)', start: dt(d,10,30), end: dt(d,12,0), color: C.sato,
    meta:{ loc:'外部会議室A', owner:'佐藤 花子', body:'' } },
  { id:'s2', title:'社内研修 (佐藤)', start: dt(d+1,9,0), end: dt(d+1,12,0), color: C.sato,
    meta:{ loc:'研修センター', owner:'佐藤 花子', body:'新システム操作研修' } },
  { id:'s3', title:'週次チームMTG (佐藤)', start: dt(d,9,0), end: dt(d,10,0), color: C.sato,
    meta:{ loc:'第1会議室', owner:'佐藤 花子', body:'' } },
  { id:'s4', title:'有給休暇 (佐藤)', start: dtAllDay(d+5), end: dtAllDay(d+6), allDay:true, color: C.sato,
    meta:{ loc:'', owner:'佐藤 花子', body:'' } },

  // ── 鈴木さん (赤)
  { id:'k1', title:'予算会議 (鈴木)', start: dt(d,15,0), end: dt(d,16,30), color: C.suzuki,
    meta:{ loc:'役員会議室', owner:'鈴木 一郎', body:'' } },
  { id:'k2', title:'新入社員オリエンテーション (鈴木)', start: dt(d+1,10,0), end: dt(d+1,12,0), color: C.suzuki,
    meta:{ loc:'大会議室', owner:'鈴木 一郎', body:'4月入社メンバー向け' } },
  { id:'k3', title:'週次チームMTG (鈴木)', start: dt(d,9,0), end: dt(d,10,0), color: C.suzuki,
    meta:{ loc:'第1会議室', owner:'鈴木 一郎', body:'' } },
  { id:'k4', title:'外出：顧客訪問 (鈴木)', start: dt(d+2,13,0), end: dt(d+2,17,0), color: C.suzuki,
    meta:{ loc:'渋谷オフィス', owner:'鈴木 一郎', body:'新規契約交渉' } },
];

function dt(day, h, min) {
  return new Date(y, m, day, h, min);
}
function dtAllDay(day) {
  const s = `${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  return s;
}

// ── Mini calendar ──────────────────────────────────────────────────────────────
function renderMiniCal() {
  const now = new Date();
  const year = now.getFullYear(), month = now.getMonth();
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const dayLabels = ['日','月','火','水','木','金','土'];
  let html = `
    <div class="mini-cal-header">
      <button class="btn btn-sm btn-outline-secondary py-0 px-1">‹</button>
      <span class="mini-cal-title">${year}年 ${month+1}月</span>
      <button class="btn btn-sm btn-outline-secondary py-0 px-1">›</button>
    </div>
    <div class="mini-cal-grid">
      ${dayLabels.map(l=>`<div class="mini-cal-day-label">${l}</div>`).join('')}
  `;
  for(let i=0;i<firstDay;i++) html+='<div></div>';
  for(let day=1;day<=daysInMonth;day++){
    const isToday = day===now.getDate();
    html+=`<div class="mini-cal-day${isToday?' today':''}">${day}</div>`;
  }
  html+='</div>';
  document.getElementById('mini-calendar').innerHTML=html;
}

// ── FullCalendar ───────────────────────────────────────────────────────────────
let calendar;
function initCalendar() {
  calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
    locale: 'ja',
    initialView: 'timeGridWeek',
    initialDate: today,
    headerToolbar: { left:'prev,next today', center:'title', right:'' },
    height: 'auto',
    nowIndicator: true,
    selectable: true,
    editable: true,
    events: DEMO_EVENTS.map(e => ({
      id: e.id,
      title: e.title,
      start: e.start,
      end: e.end,
      allDay: e.allDay || false,
      backgroundColor: e.color,
      borderColor: e.color,
      extendedProps: e.meta
    })),
    eventClick(info) {
      showDetail(info.event);
    },
    select(info) {
      const s = toLocalISO(info.start);
      const e = toLocalISO(info.end);
      document.getElementById('new-ev-start').value = s;
      document.getElementById('new-ev-end').value = e;
      bootstrap.Modal.getOrCreateInstance(document.getElementById('eventModal')).show();
    },
    eventDrop() { showToast('予定を移動しました'); },
    eventResize() { showToast('予定の時間を変更しました'); }
  });
  calendar.render();
}

function toLocalISO(d) {
  if (!d) return '';
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function formatDT(dt) {
  if (!dt) return '';
  const d = dt instanceof Date ? dt : new Date(dt);
  return d.toLocaleString('ja-JP',{year:'numeric',month:'short',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit'});
}

// ── Detail panel ───────────────────────────────────────────────────────────────
function showDetail(ev) {
  document.getElementById('detail-title').textContent = ev.title;
  const p = ev.extendedProps;
  let html = '';

  const end = ev.end || ev.start;
  const sameDay = ev.start && end && new Date(ev.start).toDateString()===new Date(end).toDateString();
  const dtStr = ev.allDay
    ? `${new Date(ev.start).toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'})} (終日)`
    : sameDay
      ? `${formatDT(ev.start)} 〜 ${new Date(end).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}`
      : `${formatDT(ev.start)} 〜 ${formatDT(end)}`;

  html += `<div class="detail-label"><i class="bi bi-clock me-1"></i>日時</div><div class="detail-value">${dtStr}</div>`;

  if (p.owner) html += `<div class="detail-label"><i class="bi bi-person me-1"></i>カレンダー</div><div class="detail-value">${p.owner}</div>`;
  if (p.loc) html += `<div class="detail-label"><i class="bi bi-geo-alt me-1"></i>場所</div><div class="detail-value">${p.loc}</div>`;
  if (p.recurring) html += `<span class="detail-badge"><i class="bi bi-arrow-repeat me-1"></i>定期的な予定</span><br>`;
  if (p.body && p.body.trim()) html += `<div class="detail-label mt-2"><i class="bi bi-card-text me-1"></i>メモ</div><div class="detail-value" style="white-space:pre-wrap;font-size:12px;color:#605e5c">${p.body}</div>`;

  document.getElementById('detail-content').innerHTML = html;
  document.getElementById('event-detail-panel').classList.add('open');
}

document.getElementById('btn-detail-close').addEventListener('click', () => {
  document.getElementById('event-detail-panel').classList.remove('open');
});
document.getElementById('btn-detail-edit').addEventListener('click', () => {
  document.getElementById('event-detail-panel').classList.remove('open');
  bootstrap.Modal.getOrCreateInstance(document.getElementById('eventModal')).show();
});

// ── View switcher ──────────────────────────────────────────────────────────────
document.getElementById('view-month').onclick = () => { calendar.changeView('dayGridMonth'); setActiveView('view-month'); };
document.getElementById('view-week').onclick  = () => { calendar.changeView('timeGridWeek'); setActiveView('view-week'); };
document.getElementById('view-day').onclick   = () => { calendar.changeView('timeGridDay'); setActiveView('view-day'); };
document.getElementById('view-list').onclick  = () => { calendar.changeView('listWeek'); setActiveView('view-list'); };
function setActiveView(id) {
  ['view-month','view-week','view-day','view-list'].forEach(v => {
    document.getElementById(v).classList.toggle('active', v===id);
  });
}

// ── Modals ─────────────────────────────────────────────────────────────────────
document.getElementById('btn-new-event').onclick = () => {
  const now = toLocalISO(new Date());
  const later = toLocalISO(new Date(Date.now()+60*60*1000));
  document.getElementById('new-ev-start').value = now;
  document.getElementById('new-ev-end').value = later;
  bootstrap.Modal.getOrCreateInstance(document.getElementById('eventModal')).show();
};
document.getElementById('btn-create-demo').onclick = () => showToast('予定を作成しました (デモ)');
document.getElementById('btn-open-settings').onclick = () =>
  bootstrap.Modal.getOrCreateInstance(document.getElementById('settingsModal')).show();
document.getElementById('btn-open-add-user').onclick = () =>
  bootstrap.Modal.getOrCreateInstance(document.getElementById('addUserModal')).show();

// ── Search (demo) ──────────────────────────────────────────────────────────────
document.getElementById('search-input').addEventListener('input', function() {
  const q = this.value.trim().toLowerCase();
  if (!q) { calendar.getEvents().forEach(e => e.setProp('display','')); return; }
  calendar.getEvents().forEach(e => {
    const match = e.title.toLowerCase().includes(q) ||
      (e.extendedProps.loc||'').toLowerCase().includes(q);
    e.setProp('display', match ? '' : 'none');
  });
});

// ── Toast ──────────────────────────────────────────────────────────────────────
function showToast(msg, type='success') {
  const el = document.getElementById('toast');
  el.className = `toast align-items-center text-bg-${type} border-0`;
  document.getElementById('toast-msg').textContent = msg;
  bootstrap.Toast.getOrCreateInstance(el,{delay:2500}).show();
}

// ── Boot ───────────────────────────────────────────────────────────────────────
renderMiniCal();
initCalendar();
</script>
</body>
</html>
