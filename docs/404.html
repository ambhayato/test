<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - ページが見つかりません | Web マニュアル</title>
  <style>
    :root {
      --accent: #0078D4;
      --text:   #24292e;
      --muted:  #6a737d;
      --bg:     #f6f8fa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .icon {
      margin-bottom: 24px;
      opacity: 0.6;
    }
    .code {
      font-size: 5rem;
      font-weight: 800;
      color: var(--accent);
      line-height: 1;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 12px;
    }
    p {
      color: var(--muted);
      max-width: 400px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .btn {
      display: inline-block;
      padding: 12px 28px;
      background: var(--accent);
      color: #fff;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      transition: background 0.15s;
    }
    .btn:hover { background: #106EBE; }
  </style>
</head>
<body>

  <div class="icon">
    <svg width="72" height="72" viewBox="0 0 72 72" fill="none" aria-hidden="true">
      <rect x="8" y="8" width="56" height="56" rx="8" stroke="#0078D4" stroke-width="2.5" stroke-dasharray="6 4"/>
      <path d="M28 28l16 16M44 28L28 44" stroke="#0078D4" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="code">404</div>
  <h1>ページが見つかりません</h1>
  <p>
    お探しのページは存在しないか、移動または削除された可能性があります。<br />
    URL をご確認の上、マニュアルトップからお探しください。
  </p>
  <a class="btn" href="/">マニュアルトップへ戻る</a>

</body>
</html>
