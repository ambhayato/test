<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web マニュアル</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='%230078D4'/><text x='6' y='24' font-size='22' font-family='Arial' fill='white' font-weight='bold'>M</text></svg>" />
</head>
<body>

  <!-- ============================================================
       ヘッダー（トップバー）
       ============================================================ -->
  <header class="top-bar" role="banner">

    <!-- モバイル用ハンバーガーボタン -->
    <button class="hamburger" id="hamburger-btn"
            aria-label="サイドバーを開閉"
            aria-expanded="false"
            aria-controls="sidebar">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- サイトロゴ・タイトル -->
    <a class="site-logo" href="/" aria-label="マニュアルトップへ">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true">
        <rect width="28" height="28" rx="5" fill="#0078D4"/>
        <rect x="6" y="7" width="16" height="2" rx="1" fill="white"/>
        <rect x="6" y="12" width="12" height="2" rx="1" fill="white"/>
        <rect x="6" y="17" width="14" height="2" rx="1" fill="white"/>
      </svg>
      Web マニュアル
    </a>

    <!-- 検索バー -->
    <div class="search-wrapper" role="search">
      <svg class="search-icon" width="14" height="14" viewBox="0 0 16 16"
           fill="none" aria-hidden="true">
        <circle cx="6.5" cy="6.5" r="5" stroke="currentColor" stroke-width="1.5"/>
        <line x1="10.5" y1="10.5" x2="14.5" y2="14.5"
              stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <input type="search"
             id="search-input"
             class="search-input"
             placeholder="ドキュメントを検索..."
             aria-label="ドキュメントを検索"
             autocomplete="off"
             spellcheck="false" />
      <div id="search-results" class="search-results" role="listbox" aria-label="検索結果"></div>
    </div>

  </header>

  <!-- ============================================================
       サイドバー（目次 TOC）
       ============================================================ -->
  <nav class="sidebar" id="sidebar"
       aria-label="目次"
       role="navigation">
    <div class="toc-header">目次</div>
    <div class="toc-nav" id="toc-nav">
      <!-- JavaScript によって動的に生成されます -->
    </div>
  </nav>

  <!-- ============================================================
       メインコンテンツエリア
       ============================================================ -->
  <main class="content-area" id="main-content" role="main">
    <div class="content-inner">

      <!-- パンくずリスト -->
      <nav class="breadcrumb" id="breadcrumb" aria-label="パンくずリスト">
        <a href="/">ホーム</a>
        <span aria-hidden="true">›</span>
        <span id="breadcrumb-section"></span>
        <span id="breadcrumb-sep" aria-hidden="true" style="display:none">›</span>
        <span id="breadcrumb-page"></span>
      </nav>

      <!-- コンテンツ注入エリア -->
      <article id="content-body" aria-live="polite">
        <!-- 初期表示プレースホルダー -->
        <div class="content-placeholder">
          <svg width="64" height="64" viewBox="0 0 64 64" fill="none" aria-hidden="true">
            <rect x="8"  y="8"  width="48" height="48" rx="6" stroke="#0078D4" stroke-width="2"/>
            <rect x="16" y="20" width="32" height="3"  rx="1.5" fill="#0078D4"/>
            <rect x="16" y="29" width="24" height="3"  rx="1.5" fill="#0078D4"/>
            <rect x="16" y="38" width="28" height="3"  rx="1.5" fill="#0078D4"/>
          </svg>
          <p>左の目次からページを選択してください</p>
        </div>
      </article>

      <!-- 前へ / 次へ ページナビゲーション -->
      <nav class="page-nav" id="page-nav" aria-label="ページナビゲーション">
        <button class="page-nav-btn hidden" id="btn-prev" aria-label="前のページへ">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M10 3L5 8L10 13" stroke="currentColor" stroke-width="1.5"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="page-nav-label">
            <small>前のページ</small>
            <span id="prev-title"></span>
          </span>
        </button>
        <button class="page-nav-btn hidden" id="btn-next" aria-label="次のページへ">
          <span class="page-nav-label" style="text-align:right">
            <small>次のページ</small>
            <span id="next-title"></span>
          </span>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M6 3L11 8L6 13" stroke="currentColor" stroke-width="1.5"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </nav>

    </div>
  </main>

  <!-- ================================================================
       オーバーレイ（モバイル時サイドバー背景クリック閉じ）
       ================================================================ -->
  <div id="sidebar-overlay"
       style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:80;"
       aria-hidden="true"></div>

  <!-- ================================================================
       スクリプト（順序重要: content.js → app.js → search.js）
       ================================================================ -->
  <script src="js/content.js"></script>
  <script src="js/app.js"></script>
  <script src="js/search.js"></script>

</body>
</html>
