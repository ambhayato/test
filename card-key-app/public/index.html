<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>カードキー管理</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2213%22 font-size=%2213%22>🔑</text></svg>" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header>
  <h1>カードキー管理</h1>
</header>

<main>
  <section class="panel">
    <h2>カードキー検索</h2>
    <input id="search-input" type="text" placeholder="カードキー名 または 利用者名で検索" />
  </section>

  <section class="panel">
    <h2>カードキー一覧</h2>
    <div id="card-key-grid" class="card-grid"></div>
  </section>

  <section class="panel">
    <h2>貸出登録</h2>
    <form id="loan-form" class="inline-form">
      <label>
        カードキー
        <select id="loan-card-key" required></select>
      </label>
      <label>
        利用者
        <input id="loan-user" type="text" required placeholder="氏名" />
      </label>
      <label>
        利用日
        <input id="loan-use-date" type="date" required />
      </label>
      <label>
        返却予定日
        <input id="loan-due-date" type="date" required />
      </label>
      <button type="submit">貸出登録</button>
    </form>
    <p id="loan-message" class="message"></p>
  </section>

  <section class="panel">
    <h2>利用履歴</h2>
    <label>
      カードキーを選択
      <select id="history-card-key"></select>
    </label>
    <table class="history-table">
      <thead>
        <tr>
          <th>利用者</th>
          <th>利用日</th>
          <th>返却予定日</th>
          <th>返却日</th>
          <th>状態</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="history-body"></tbody>
    </table>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
